# Nome da aplicação
spring.application.name=usuario

# Configuração do banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_usuario
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Porta do serviço usuário
server.port=8080

# Chave JWT (igual em todos os microsserviços)
jwt.secret=sua-chave-secreta-super-segura-que-deve-ser-bem-longa

# Logs (opcional)
logging.level.com.javanauta.usuario=INFO
